<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="description" content="Günün beş harfli kelimesini altı denemede bul." />
    <title>Harfane | Günün kelimesi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Harfane ana sayfa">
          <span class="brand-mark">H</span>
          <div>
            <p class="brand-name">Harfane</p>
            <p class="brand-tagline">Günün kelimesi</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="help-button" aria-label="Nasıl oynanır?">?</button>
          <button class="icon-button" id="stats-button" aria-label="İstatistikler">↗</button>
        </div>
      </header>

      <section class="game-intro">
        <div>
          <p class="eyebrow">GÜNÜN BULMACASI <span id="puzzle-number">#001</span></p>
          <h1>Kelimeyi <em>yakala.</em></h1>
          <p class="intro-copy">Beş harfli kelimeyi altı denemede bul.<br />Her renk sana yeni bir ipucu verir.</p>
        </div>
        <div class="streak-card" aria-label="Galibiyet serisi">
          <span class="streak-icon">✦</span>
          <div><strong id="streak-value">0</strong><span>seri</span></div>
        </div>
      </section>

      <section class="board-wrap" aria-label="Tahmin tahtası">
        <div class="board" id="board"></div>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </section>

      <section class="keyboard" id="keyboard" aria-label="Sanal klavye"></section>

      <section class="daily-footer">
        <div>
          <span class="footer-label">YARININ BULMACASINA</span>
          <strong id="countdown">00:00:00</strong>
        </div>
        <button class="share-button" id="share-button" disabled>
          Sonucunu paylaş <span>↗</span>
        </button>
      </section>
    </main>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" id="modal-close" aria-label="Pencereyi kapat">×</button>
        <div id="modal-content"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="kelimeler.js"></script>
    <script src="script.js"></script>
  </body>
</html>
