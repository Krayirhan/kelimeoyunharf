<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9f6" />
    <meta name="description" content="Hafızanı sına, eş kartları bul. Oyun Arası'nda ücretsiz ve reklamsız oyna." />
    <title>Hafıza Kartları | Oyun Arası</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="../../" aria-label="Oyun Arası ana sayfa"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="brand-name">oyun<span>arası</span></span></a>
        <a class="back-link" href="../../">← Tüm oyunlar</a>
      </header>
      <section class="game" aria-labelledby="game-title">
        <div class="heading">
          <div><p class="eyebrow">HAFIZANI ÇALIŞTIR</p><h1 id="game-title">Hafıza<span>.</span></h1><p class="intro">Eş kartları bul, en iyi sonucunu yakala.</p></div>
          <label class="level-picker">TAHTA BOYUTU<select id="pair-count" aria-label="Tahta boyutu"><option value="8">Klasik · 4×4</option><option value="18">Geniş · 6×6</option></select></label>
        </div>
        <div class="stats" aria-label="Oyun istatistikleri">
          <div><span>SÜRE</span><strong id="timer">00:00</strong></div>
          <div><span>HAMLE</span><strong id="moves">0</strong></div>
          <div><span>EŞLEŞME</span><strong id="matches">0 / 8</strong></div>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">Bir kart açarak başla.</div>
        <div class="board" id="board" role="group" aria-label="Hafıza kartları"></div>
        <div class="actions"><button class="button primary" id="new-game" type="button">Yeni oyun</button><span id="best" class="best">En iyi: —</span></div>
        <p class="help" id="help">Bir turda iki kart aç. Eşleşen çiftler açık kalır.</p>
        <p class="save-state" id="save-state">Oyun bu cihazda saklanır.</p>
      </section>
      <footer class="footer"><a href="../../">oyun<span>arası</span></a><span>Biraz oyna, iyi hisset.</span></footer>
    </main>
  </body>
</html>
