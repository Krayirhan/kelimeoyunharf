<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9f6" />
    <meta name="description" content="Aynı cihazda iki kişi XOX oyna. Oyun Arası'nda ücretsiz ve reklamsız." />
    <title>XOX | Oyun Arası</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="../../" aria-label="Oyun Arası ana sayfa"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="brand-name">oyun<span>arası</span></span></a>
        <a class="back-link" href="../../">← Tüm oyunlar</a>
      </header>
      <section class="game" aria-labelledby="game-title">
        <div class="heading">
          <div><p class="eyebrow">İKİ KİŞİ · AYNI CİHAZDA</p><h1 id="game-title">XOX<span>.</span></h1><p class="intro">Sırayla oyna, üç işareti yan yana getir.</p></div>
          <div class="turn-card" id="turn-card" role="status" aria-live="polite">Sıra: <strong id="turn">X</strong></div>
        </div>
        <div class="scoreboard" aria-label="Tur skorları">
          <div><span>OYUNCU X</span><strong id="score-x">0</strong></div>
          <div><span>BERABERE</span><strong id="score-draws">0</strong></div>
          <div><span>OYUNCU O</span><strong id="score-o">0</strong></div>
        </div>
        <div class="board" id="board" role="group" aria-label="XOX oyun tahtası" aria-describedby="board-help"></div>
        <p class="message" id="message" role="status" aria-live="polite">X başlıyor. Bir kare seç.</p>
        <div class="actions">
          <button class="button primary" id="round-button" type="button">Yeni tur</button>
          <button class="button quiet" id="scores-button" type="button">Skorları sıfırla</button>
        </div>
        <p class="board-help" id="board-help">Kareler arasında ok tuşlarıyla ilerle; Enter veya Boşluk ile işaretle.</p>
        <p class="save-state" id="save-state">Oyun bu cihazda saklanır.</p>
      </section>
      <footer class="footer"><a href="../../">oyun<span>arası</span></a><span>Biraz oyna, iyi hisset.</span></footer>
    </main>
  </body>
</html>
